# Spring profile: integration
# Activated by: mvn test -P integration-test
#
# Embedded Zeebe + full Connectors runtime (Docker). Real Bedrock calls.
# Service tools call claim-demo.free.beeceptor.com — no extra secrets needed.
#
# Run from the test/ directory:
#   env $(cat ../../../.env | grep -v '^#' | xargs) mvn test -P integration-test

camunda:
  process-test:
    runtime-mode: managed
    connectors-enabled: true
    # Connectors bundle image, aligned to the 8.10 runtime (8.10.0-alpha2 is the
    # latest published camunda/connectors-bundle 8.10 tag).
    connectors-docker-image-version: 8.10.0-alpha2
    # Relaxed-binding form avoids Spring Boot 4 circular placeholder detection.
    # AWS_BEDROCK_ACCESS_KEY env var → aws.bedrock.access.key Spring property.
    # Gotcha: inference-profile ARNs can be double-encoded in some local paths.
    # Prefer aws.bedrock.model.id (or AWS_BEDROCK_MODEL_ID) when available.
    connectors-secrets:
      AWS_BEDROCK_REGION: ${AWS_BEDROCK_REGION}
      AWS_BEDROCK_ACCESS_KEY: ${AWS_BEDROCK_ACCESS_KEY}
      AWS_BEDROCK_SECRET_KEY: ${AWS_BEDROCK_SECRET_KEY}
      AWS_BEDROCK_SESSION_TOKEN: ${AWS_BEDROCK_SESSION_TOKEN:}
      AWS_BEDROCK_MODEL: ${AWS_BEDROCK_MODEL_ID:${AWS_BEDROCK_MODEL}}
    # LLM-as-judge provider for the agentic quality assertions (CR-4, CR-5).
    # Reuses the same Bedrock credentials as the connector runtime.
    # All references use env var names directly (AWS_*) so Spring can resolve them
    # at context load time — before @BeforeAll sets any system properties.
    judge:
      threshold: 0.7
      chat-model:
        provider: amazon-bedrock
        model: ${AWS_BEDROCK_MODEL_ID:${AWS_BEDROCK_MODEL}}
        region: ${AWS_BEDROCK_REGION}
        credentials:
          access-key: ${AWS_BEDROCK_ACCESS_KEY}
          secret-key: ${AWS_BEDROCK_SECRET_KEY}
          session-token: ${AWS_BEDROCK_SESSION_TOKEN:}
    # Embedding model for semantic-similarity assertions (SIR-4). Bedrock Titan
    # embeddings; the model need not match the agent or the judge.
    similarity:
      threshold: 0.5
      embedding-model:
        provider: amazon-bedrock
        model: amazon.titan-embed-text-v2:0
        region: ${AWS_BEDROCK_REGION}
        dimensions: 256
        credentials:
          access-key: ${AWS_BEDROCK_ACCESS_KEY}
          secret-key: ${AWS_BEDROCK_SECRET_KEY}
          session-token: ${AWS_BEDROCK_SESSION_TOKEN:}

logging:
  level:
    root: warn
    io.camunda.process.test: info
    io.camunda.tests: info
    org.testcontainers: warn
    tc: error
